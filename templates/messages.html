<!DOCTYPE html>
<html>
<head>
    <title>Contact Messages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #009688;
            color: white;
        }
    </style>
</head>

<body>

<h1>Contact Messages</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Subject</th>
        <th>Message</th>
    </tr>

    {% for msg in messages %}
    <tr>
        <td>{{ msg['id'] }}</td>
        <td>{{ msg['name'] }}</td>
        <td>{{ msg['email'] }}</td>
        <td>{{ msg['phone'] }}</td>
        <td>{{ msg['subject'] }}</td>
        <td>{{ msg['message'] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
